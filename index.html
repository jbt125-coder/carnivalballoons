function slantEye(c,x,y,rot){ c.save(); c.translate(x,y); c.rotate(rot); c.beginPath(); CE(c,0,0,0.14,0.08); c.fillStyle='#120a20'; c.fill(); c.beginPath(); c.arc(-0.04,-0.02,0.025,0,TAU); c.fillStyle='#ffffff'; c.fill(); c.restore(); }

}

/* ---------- update ---------- */

  if(kx||ky){ m=Math.sqrt(kx*kx+ky*ky); ret.x+=kx/m*K*0.6*dt; ret.y+=ky/m*K*0.6*dt; }

}

    p.vy+=(p.k===2?60:H*1.6)*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.985; p.rot+=p.vr*dt; }

function update(dt){
  var i,b;

  if(paused) return;
  if(state==='over'||state==='win'){ stateT+=dt; updParts(dt); return; }
  if(inPrelude()){ preludeUpdate(dt); return; }
  stateT+=dt;
  aimUpdate(dt);
  if(throwCD>0) throwCD-=dt;
  if(armAnim>0) armAnim=Math.max(0,armAnim-dt);
  if(soak>0){ soak=Math.max(0,soak-dt); for(i=0;i<soakDrops.length;i++) soakDrops[i].y+=soakDrops[i].vy*dt; }
  if(state==='play'){ if(triple>0) triple=Math.max(0,triple-dt); if(fireT>0) fireT=Math.max(0,fireT-dt); }
  if(shake>0) shake=Math.max(0,shake-dt);
  if(flash>0) flash=Math.max(0,flash-dt);
  if(touchFire||mouseFire||keyFire) throwDart();

  if(state==='intro'){ if(stateT>2.8){ state='play'; stateT=0; } }
  else if(state==='bossIntro'){ if(stateT>2.4){ spawnBoss(); state='play'; stateT=0; } }
  else if(state==='clear'){ if(stateT>2.4){ if(wave>=10){ winGame(); return; } if(wave%2===1){ startBonus(); return; } wave++; startWave(); } }
  else if(state==='play'){
    spawnT-=dt;
    if(spawnT<=0&&spawnQ.length){
      spawnWaveBalloon(spawnQ.shift());
      if(wave>=5&&spawnQ.length&&Math.random()<0.25) spawnWaveBalloon(spawnQ.shift());
      spawnT=spawnInterval()*(0.7+Math.random()*0.6);
    }
    puT-=dt; if(puT<=0){ spawnPower(); puT=14+Math.random()*8; }

    if(!spawnQ.length&&!balloons.length&&!boss){

      else { state='clear'; stateT=0; clearBonus=wave*500; score+=clearBonus; sFanfare(); }
    }
  }

function render(){
  var i, objs=[], sx=0, sy=0, d;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  uiButtons=[];

  ctx.save(); ctx.translate(sx,sy);
  ctx.drawImage(bgCanvas,0,0,W,H);
  if(inPrelude()) drawPreludeBack();
  for(i=0;i<darts.length;i++){ d=darts[i]; if(d.st!=='fly') drawDartShape(d.x,d.y,d.ang,d.sc,false); }
  for(i=0;i<balloons.length;i++) if(!balloons[i].dead) objs.push(balloons[i]);
  for(i=0;i<powers.length;i++) objs.push(powers[i]);
  if(boss) objs.push(boss);
  objs.sort(function(a,b){ return b.d-a.d; });
  for(i=0;i<objs.length;i++) drawObj(objs[i]);
  for(i=0;i<darts.length;i++){ d=darts[i]; if(d.st==='fly') drawDartShape(d.x,d.y,d.ang,d.sc,d.fire); }
  drawParts();
  ctx.restore();
  if((inGame()||wallGame())&&!paused) drawReticle();
  ctx.drawImage(boothCanvas,0,0,W,H);
  if(state==='title'){ drawSign('Step right up'); drawTitle(); return; }
  if(inPrelude()){ drawPreludeFront(); if(paused) drawPause(); return; }
  drawFlankWarn();
  drawSign('Wave '+wave+' of 10');
  drawArm(); drawSoak(); drawHUD(); drawControls();
  if(state==='intro') drawWaveBanner();
  else if(state==='bossIntro') drawSimpleBanner(BOSSES[wave].final?'Final boss!':'Mini-boss!',BOSSES[wave].name,2.4,'#7a1f9a');
  else if(state==='clear') drawSimpleBanner('Wave '+wave+' cleared!',(wave%2===1&&wave<10)?'Carnival bonus game next!':'Bonus +'+fmt(clearBonus),2.4,'#1f7a3a');
  if(flash>0){ ctx.fillStyle='rgba(255,40,60,'+(flash*0.8).toFixed(3)+')'; ctx.fillRect(0,0,W,H); }
  if(state==='over') drawEnd(false);
  else if(state==='win') drawEnd(true);
  else if(paused) drawPause();
}

  if(isBonus()){ drawBonusFront(); return; }
  drawSign(state==='carnival'?"Pop 'em all!":(state==='prize'?'Winner!':'Alert!'));
  if(state!=='invasion') drawArm();
  if(state==='carnival'){ drawControls(); if(stateT<3) drawSimpleBanner('Step right up!','Pop all 12 balloons to win a prize',3,'#c4262e'); }
  if(state==='prize'){
    e=Math.min(1,stateT/0.35); sc=e*(1+Math.sin(e*Math.PI)*0.2);
    drawBag(b.x,b.y,b.s*sc,gtime);
    txt('You won a goldfish!',W/2,b.y-b.s*1.25,clamp(U*0.075,22,40),'#ffd23f','center','#7a1f1f',6);
  }
  if(state==='invasion') drawInvasion(b);
  drawHUDPrelude();
  if(flash>0){ ctx.fillStyle='rgba(225,255,215,'+Math.min(0.8,flash*2).toFixed(3)+')'; ctx.fillRect(0,0,W,H); }
}

/* ---------- input ---------- */
function tapUI(x,y){
  var i,b;
  for(i=uiButtons.length-1;i>=0;i--){ b=uiButtons[i]; if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){ initAudio(); sClick(); b.fn(); return true; } }
  return false;
}
function setKnob(x,y){ var dx=x-joy.cx, dy=y-joy.cy, L=Math.sqrt(dx*dx+dy*dy); if(L>JR){ dx=dx/L*JR; dy=dy/L*JR; } joy.kx=dx; joy.ky=dy; }
function pointerDown(x,y,id){
  if(tapUI(x,y)) return;
  if(state==='invasion'&&!paused){ advanceLine(); return; }
  if(!(inGame()||wallGame())||paused) return;
  var dx=x-joy.hx, dy=y-joy.hy;
  if(x<W*0.5&&y>H*0.3&&joy.id===null){
    joy.id=id; joy.active=true;
    if(Math.sqrt(dx*dx+dy*dy)<JR*2){ joy.cx=joy.hx; joy.cy=joy.hy; } else { joy.cx=x; joy.cy=y; }
    setKnob(x,y);
  } else if(touchFireId===null){ touchFireId=id; touchFire=true; throwDart(); }
}
function tStart(e){
  e.preventDefault(); lastTouch=Date.now(); showTouch=true; initAudio();
  var i,t; for(i=0;i<e.changedTouches.length;i++){ t=e.changedTouches[i]; pointerDown(t.clientX,t.clientY,t.identifier); }
}
function tMove(e){
  e.preventDefault(); lastTouch=Date.now();
  var i,t; for(i=0;i<e.changedTouches.length;i++){ t=e.changedTouches[i]; if(t.identifier===joy.id) setKnob(t.clientX,t.clientY); }
}
function tEnd(e){
  e.preventDefault(); lastTouch=Date.now();
  var i,t; for(i=0;i<e.changedTouches.length;i++){ t=e.changedTouches[i];
    if(t.identifier===joy.id){ joy.id=null; joy.active=false; joy.kx=0; joy.ky=0; joy.cx=joy.hx; joy.cy=joy.hy; }
    if(t.identifier===touchFireId){ touchFireId=null; touchFire=false; } }
}
cv.addEventListener('touchstart',tStart,{passive:false});
cv.addEventListener('touchmove',tMove,{passive:false});
cv.addEventListener('touchend',tEnd,{passive:false});
cv.addEventListener('touchcancel',tEnd,{passive:false});
cv.addEventListener('mousedown',function(e){
  if(Date.now()-lastTouch<800) return;
  initAudio();
  if(tapUI(e.clientX,e.clientY)) return;
  if(state==='invasion'&&!paused){ advanceLine(); return; }
  if((inGame()||wallGame())&&!paused){ showTouch=false; ret.x=e.clientX; ret.y=e.clientY; clampRet(); mouseFire=true; throwDart(); }
});
cv.addEventListener('mousemove',function(e){
  if(Date.now()-lastTouch<800) return;
  if((inGame()||wallGame())&&!paused){ ret.x=e.clientX; ret.y=e.clientY; clampRet(); }
});
window.addEventListener('mouseup',function(){ mouseFire=false; });
document.addEventListener('keydown',function(e){
  var k=e.keyCode;
  if(k===37||k===65) keys.l=true; else if(k===39||k===68) keys.r=true; else if(k===38||k===87) keys.u=true; else if(k===40||k===83) keys.d=true;
  else if(k===32||k===13){ initAudio(); if(state==='title'){ if(!e.repeat) startPrelude(); } else if(state==='over'||state==='win'){ if(!e.repeat) startGame(); } else if(state==='invasion'){ if(!e.repeat) advanceLine(); } else if(k===32) keyFire=true; e.preventDefault(); }
  else if(k===80||k===27) togglePause();
  else if(k===77) toggleMute();
  if(k>=37&&k<=40) e.preventDefault();
});
document.addEventListener('keyup',function(e){
  var k=e.keyCode;
  if(k===37||k===65) keys.l=false; else if(k===39||k===68) keys.r=false; else if(k===38||k===87) keys.u=false; else if(k===40||k===83) keys.d=false;
  else if(k===32) keyFire=false;
});
document.addEventListener('gesturestart',function(e){ e.preventDefault(); });
document.addEventListener('visibilitychange',function(){
  if(document.hidden){ if((inGame()||inPrelude())&&!paused) togglePause(); if(AC&&AC.suspend) AC.suspend(); }
  else if(AC&&AC.resume) AC.resume();
});
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){ setTimeout(resize,250); });

/* ---------- loop ---------- */
var last=0;
function frame(ts){
  var dt=last?(ts-last)/1000:0; last=ts;
  if(dt>0.05) dt=0.05; if(dt<0) dt=0;
  update(dt); render();
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
